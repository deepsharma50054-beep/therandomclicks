<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection | therandomclicks.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="collection.css" />
</head>
<body>
  <header class="collection-header">
    <a href="index.html#locations" class="back-link">← Back to Collections</a>
    <div class="collection-intro">
      <p class="collection-eyebrow" id="collectionEyebrow">Collection</p>
      <h1 id="collectionTitle">Gallery Collection</h1>
      <p id="collectionDescription">Explore a curated set of photographs in this collection.</p>
    </div>
  </header>

  <main class="collection-main">
    <section class="collection-story" id="collectionStory" hidden>
      <div class="story-grid" id="storyGrid"></div>
    </section>
    <section class="collection-grid" id="collectionGrid"></section>
  </main>

  <div class="lightbox" id="lightbox" hidden aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close gallery">×</button>
    <button class="lightbox-fullscreen" id="lightboxFullscreen" type="button" aria-label="Open fullscreen">⛶</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous image">‹</button>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Image gallery">
      <img class="lightbox-image" id="lightboxImage" src="" alt="">
      <div class="lightbox-caption">
        <h2 id="lightboxTitle"></h2>
        <p id="lightboxDescription"></p>
      </div>
    </div>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next image">›</button>
  </div>

  <script src="collection.js"></script>
</body>
</html>
